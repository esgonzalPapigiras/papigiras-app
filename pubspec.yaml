name: papigiras_app
description: PapiGiras - experiencia móvil para coordinadores, apoderados y pasajeros.
publish_to: none
# Xcode Cloud sets iOS version and build number separately in ios/ci_scripts/ci_post_clone.sh.
version: 1.1.3+17
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  provider: ^6.1.2
  quickalert: ^1.0.2
  rxdart: ^0.27.7
  photo_view: ^0.15.0
  qr_flutter: ^4.1.0
  flutter_map: 7.0.2
  vector_map_tiles: 8.0.0
  vector_tile_renderer: 5.2.0
  flutter_map_marker_popup: 7.0.0
  latlong2: 0.9.1
  http: ^1.2.2
  image_picker: 1.2.3
  path_provider: 2.1.5
  # Classic platform plugins avoid native-assets hooks unsupported by this Flutter toolchain.
  path_provider_android: 2.2.17
  path_provider_foundation: 2.4.4
  share_plus: 10.1.4
  # Restore the official app's external contact launcher.
  url_launcher: 6.3.1
  flutter_pdfview: 1.4.5
  # Pilo-only fix: serialize native camera errors and handle asynchronous startup.
  qr_code_scanner_plus:
    path: third_party/qr_code_scanner_plus
  gal: 2.3.3
  zxing2: 0.2.4
  shared_preferences: 2.5.5
  file_picker: 10.3.10
  flutter_image_compress: 2.5.1
  record: 6.2.1
  audioplayers: 6.6.0
  # Preserve the versions used by the official app's APNs/FCM integration.
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  flutter_local_notifications: 17.2.4
  geolocator: 13.0.2
  permission_handler: 12.0.0+1
  background_locator_2:
    path: packages/background_locator_2-2.0.6
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/maps/
    - assets/fonts/Manjari-OFL.txt
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Manjari
      fonts:
        - asset: assets/fonts/Manjari-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
